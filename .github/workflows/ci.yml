name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Log storage isn't always reachable from restricted environments —
            # surface the analyzer output as a check annotation instead.
            msg=$(head -c 20000 /tmp/analyze.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter analyze failed::${msg}"
            exit $code
          fi
      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(tail -c 12000 /tmp/test.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=flutter test failed::${msg}"
            exit $code
          fi
      - name: Upload rendered preview artefacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-renders
          path: preview/

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: rigstudio-release-apk
          path: build/app/outputs/flutter-apk/*.apk
