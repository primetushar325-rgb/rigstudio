name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Engine, app logic & character sheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The Kotlin compiler distribution, so tools/verify_all.sh can compile :core and the
      # non-Compose :app sources against tools/android-stubs without the Android SDK.
      - name: Install kotlinc
        run: npm install --no-save --ignore-scripts kotlin-compiler
      - name: Run verify_all (tests, compile checks, template + sheet invariants)
        env:
          KOTLIN_HOME: ${{ github.workspace }}/node_modules/kotlin-compiler/package
        run: bash tools/verify_all.sh --drift
      - name: Upload the rendered blank character sheet
        uses: actions/upload-artifact@v4
        with:
          name: blank-character-sheet
          path: docs/assets/blank-character-sheet.png

  apk:
    name: Debug APK (Gradle + Android SDK)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rigstudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
