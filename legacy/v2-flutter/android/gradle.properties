# Tuned for low-memory CI/sandbox machines. On a dev laptop you can raise
# -Xmx to 4G and re-enable the daemon/parallel builds for faster rebuilds.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.vfs.watch=false
